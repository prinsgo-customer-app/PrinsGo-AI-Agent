name: Build PrinsGo AI Agent APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-app-native/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-app-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app-native/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Build Release APK
        run: |
          cd android
          ./gradlew clean assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             PrinsGo_AI_Agent_Release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrinsGo-AI-Agent-Release
          path: mobile-app-native/PrinsGo_AI_Agent_Release.apk
          retention-days: 14
